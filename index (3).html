<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Les Terrasses">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Maison Les Terrasses</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: plein écran sobre. Grande peinture en tête, sections séparées par de fines lignes, navigation fixe en bas. */
:root{
  --bg:#F1F3F0; --surface:#FAFBF9; --ink:#1B2421; --mut:#5E6B67; --line:#D5DCD7;
  --em:#0F5A4D; --em-ink:#FFFFFF; --tint:#E3ECE7; --wood:#85693E; --woodbg:#E4D9C4; --warn:#A5442C;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --ink:#E6ECE8; --mut:#9AABA4; --line:#25322D;
  --em:#3BA58D; --em-ink:#06201A; --tint:#182822; --wood:#C7AA7C; --woodbg:#2E2820; --warn:#E58E72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --ink:#E6ECE8; --mut:#9AABA4; --line:#25322D;
  --em:#3BA58D; --em-ink:#06201A; --tint:#182822; --wood:#C7AA7C; --woodbg:#2E2820; --warn:#E58E72; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding-bottom:84px;-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* hero */
.hero{position:relative;height:clamp(330px,66vw,540px);background:#22312c;overflow:hidden}
.hero.short{height:clamp(240px,48vw,380px)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 32%;max-width:none}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,13,.35) 0,rgba(6,16,13,0) 30%,rgba(6,16,13,.78) 100%)}
.hin{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding-block:14px 26px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hero h1{font:500 clamp(38px,9vw,60px)/1.02 var(--serif);color:#fff;letter-spacing:.01em;text-wrap:balance}
/* barre haute */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:18px 8px}
.brand{font:500 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.pt{font:500 38px/1.05 var(--serif);text-wrap:balance}
.avbtn{border:0;background:none;padding:0;border-radius:50%;cursor:pointer;line-height:0}
.hero .avbtn{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;color:#fff;font-weight:600;flex:none}
/* sections */
.sec{padding-block:22px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sl{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.sl-r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:0;padding:0;color:var(--em);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row.alert{background:var(--tint);padding:12px;margin-bottom:8px;border-bottom:0}
.static{cursor:default}
.rt{flex:1;min-width:0}
.rt b{font-weight:600;display:block}
.rt small,small{display:block;color:var(--mut);font-size:14px;line-height:1.35}
.tag{font-size:12px;letter-spacing:.04em;padding:3px 10px;border:1px solid var(--line);border-radius:99px;white-space:nowrap;color:var(--mut)}
.tag.ok{color:var(--em);border-color:var(--em)}
.tag.go{background:var(--em);color:var(--em-ink);border-color:var(--em)}
.tag.opt{color:var(--wood);border-color:var(--wood);border-style:dashed}
.tag.no{color:var(--warn);border-color:var(--warn)}
.rn{font:500 28px/1 var(--serif);width:22px;color:var(--wood)}
.big{font:500 46px/1 var(--serif);font-variant-numeric:tabular-nums}
.big.sm{font-size:30px;white-space:nowrap}
.big i{font:400 14px var(--sans);color:var(--mut);margin-left:3px}
.fig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fig small{margin-top:6px}
/* boutons et champs */
.btn{display:block;width:100%;padding:15px 18px;border:0;border-radius:2px;background:var(--em);color:var(--em-ink);font:600 14px var(--sans);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:none;color:var(--em);border:1px solid var(--em)}
.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:12px}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.cta{margin-top:6px}
label,.lbl{display:block;font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{min-height:22px;margin-top:10px;font-size:14px;color:var(--mut)}
.hint.bad{color:var(--warn)}.hint.good{color:var(--em)}
.back{background:none;border:0;padding:16px 0 4px;color:var(--mut);cursor:pointer;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;margin:12px 0 4px}
.seg button{flex:1;padding:10px;border:0;background:none;cursor:pointer;font-size:14px}
.seg button.on{background:var(--em);color:var(--em-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chips button{padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:none;cursor:pointer;font-size:14px}
.chips button.on{border-color:var(--em);color:var(--em);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.opts button{padding:12px 6px;border:1px solid var(--line);border-radius:2px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.opts button.on{background:var(--em);color:var(--em-ink);border-color:var(--em)}
.quote{font:italic 400 18px/1.35 var(--serif);color:var(--ink);margin-top:4px}
.date-title{font:500 30px/1.1 var(--serif);margin:14px 0 4px;text-wrap:balance}
.bar{height:6px;background:var(--line);margin-top:8px}
.bar>div{height:100%;background:var(--em)}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .head{display:flex;justify-content:space-between;gap:10px}
/* calendrier */
.mnav{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px}
.mnav h2{font:500 30px/1 var(--serif);text-transform:capitalize}
.mnav button{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:2px;cursor:pointer;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dh{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.dc{min-height:56px;border:1px solid var(--line);background:var(--surface);padding:4px 3px;text-align:left;position:relative;overflow:hidden;color:var(--ink);border-radius:0}
button.dc{cursor:pointer}
.dc i{display:block;font-style:normal;font-size:11px;color:var(--mut)}
.dc span{display:block;font-size:10px;line-height:1.15;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc.conf{background:var(--em);border-color:var(--em);color:var(--em-ink)}
.dc.conf i{color:inherit;opacity:.8}
.dc.opt{background:repeating-linear-gradient(135deg,var(--woodbg) 0 6px,transparent 6px 12px);border:1px dashed var(--wood)}
.dc.today{outline:2px solid var(--ink);outline-offset:-2px}
.dc.blank{border:0;background:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 4px;font-size:13px;color:var(--mut)}
.legend b{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border:1px solid var(--em);background:var(--em)}
.legend b.o{background:repeating-linear-gradient(135deg,var(--woodbg) 0 4px,transparent 4px 8px);border:1px dashed var(--wood)}
/* livre et sujets */
.post{padding:18px 0;border-top:1px solid var(--line)}
.post .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph{display:grid;gap:4px;margin-bottom:10px}
.ph.n2,.ph.n3,.ph.n4{grid-template-columns:1fr 1fr}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:var(--line)}
.ph.n1 img{aspect-ratio:3/2}
.prev{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.prev img{width:76px;height:76px;object-fit:cover}
.iss{padding:16px 0;border-top:1px solid var(--line)}
.ih{display:flex;gap:12px;align-items:flex-start}
.chk{border:0;background:none;color:var(--mut);cursor:pointer;padding:0;line-height:0;flex:none}
.chk:hover{color:var(--em)}.chk.on{color:var(--em)}
.iss h3{font:600 16px/1.3 var(--sans)}
.iss p{margin:8px 0 0 36px;color:var(--ink)}
.iss .ph{margin:10px 0 0 36px}
.cm{margin:8px 0 0 36px;font-size:15px}
.cm small{display:inline}
.cmf{display:flex;gap:8px;margin:10px 0 0 36px}
.done h3{text-decoration:line-through;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:2px;font-size:14px;z-index:40;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#lb{position:fixed;inset:0;background:rgba(6,12,10,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:20}
nav button{flex:1;position:relative;border:0;background:none;padding:6px 0 2px;color:var(--mut);font-size:11px;letter-spacing:.03em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--em);font-weight:600}
nav .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:17px;font-weight:600}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head><body>
<main id="app"><div class="wrap"><p class="empty" style="padding-block:40px">Chargement…</p></div></main>
<nav id="nav" hidden></nav>
<div id="toast" role="status"></div>
<div id="lb" hidden></div>

  if(a.getFullYear()===b.getFullYear()){
    if(a.getMonth()===b.getMonth())return a.getDate()+" – "+b.toLocaleDateString("fr-FR",o2);
    return a.toLocaleDateString("fr-FR",o1)+" – "+b.toLocaleDateString("fr-FR",o2);
  }
  return a.toLocaleDateString("fr-FR",o2)+" – "+b.toLocaleDateString("fr-FR",o2);
}
function fshort(ts){return new Date(ts).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function overlap(a,b){return a.from<b.to&&b.from<a.to}
function plural(n,w){return n+" "+w+(n>1?"s":"")}

var fs=null,auth=null,user=null,authReady=false,ready=false,pend=false,busy=false,unsubs=[],profLoaded=false;

/* ---------- données ---------- */
function norm(b){if(b.status==="accepted")b.status="pending";if(b.status==="refused")b.status="cancelled";return b}
function byId(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function act(b){return b.status==="pending"||b.status==="confirmed"}
function resp(b,n){return b[FIELD[n]]||null}
function answered(b){return APPR.every(function(n){return resp(b,n)})}
function nAnswers(b){return APPR.filter(function(n){return resp(b,n)}).length}
function canAct(b){return b.who===me||b.by===me}
function statusOf(b){
  if(b.status==="confirmed")return{cls:"ok",label:"Confirmée"};
  if(b.status==="cancelled")return{cls:"off",label:"Annulée"};
  var n=nAnswers(b);
  if(n===2)return{cls:"go",label:"Réponses reçues"};
  return{cls:"opt",label:"Option · "+n+"/2"};
}
function nn(b){var n=nights(b.from,b.to);return plural(n,"nuit")+(b.guests?" · "+plural(b.guests,"personne"):"")}
function ranking(y){
  var m={};MEMBERS.forEach(function(n){m[n]={m:n,n:0,s:0}});
  B.forEach(function(b){
    if(b.status!=="confirmed")return;
    var k=y==null?nights(b.from,b.to):nightsIn(b,y);
    if(k>0){if(!m[b.who])m[b.who]={m:b.who,n:0,s:0};m[b.who].n+=k;m[b.who].s++}
  });
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.n-a.n||b.s-a.s||MEMBERS.indexOf(a.m)-MEMBERS.indexOf(b.m)});
}
function hue(n){return(Math.max(0,MEMBERS.indexOf(n))*47+150)%360}

/* ---------- éléments communs ---------- */
function av(n,sz){
  sz=sz||36;var p=MB[n]&&MB[n].photo;
  if(p)return'<img class="av" style="width:'+sz+'px;height:'+sz+'px" src="'+p+'" alt="">';
  return'<span class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.42)+'px;background:hsl('+hue(n)+' 30% 36%)">'+esc((n||"?").charAt(0))+'</span>';
}

  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',

function ico(k,s){s=s||22;return'<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>'}
function sec(label,body,right){
  return'<section class="sec"><div class="sl-r"><h2 class="sl">'+label+'</h2>'+(right||"")+'</div>'+body+'</section>';
}
function hero(home,short){
  return'<section class="hero'+(short?" short":"")+'"><img src="'+HERO+'" alt="'+HERO_ALT+'"><div class="shade"></div><div class="hin"><div class="wrap hrow"><span></span>'+(me&&home?'<button class="avbtn" data-a="profile" aria-label="Mon profil">'+av(me,40)+'</button>':'')+'</div><div class="wrap"><h1>Maison Les Terrasses</h1></div></div></section>';

function top(title){

}
function bRow(b){
  var s=statusOf(b);
  return'<button class="row" data-a="open" data-id="'+b.id+'">'+av(b.who,40)+'<span class="rt"><b>'+esc(b.who)+'</b><small>'+rng(b.from,b.to)+' · '+nn(b)+'</small></span><span class="tag '+s.cls+'">'+s.label+'</span></button>';
}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=""},3200)}

/* ---------- à faire pour moi ---------- */
function todo(){
  var out=[],t=today();
  B.filter(function(b){return b.status==="pending"}).forEach(function(b){
    if(APPR.indexOf(me)>=0&&!resp(b,me)){
      var d=Math.floor((Date.now()-(b.created||Date.now()))/MS);
      out.push('<button class="row alert" data-a="open" data-id="'+b.id+'">'+av(b.who,40)+'<span class="rt"><b>'+esc(b.who)+' demande la maison</b><small>'+rng(b.from,b.to)+' · '+(d>=14?"Relance : sans réponse depuis "+d+" jours":d>=7?"Relance : sans réponse depuis "+d+" jours":"Ta réponse est attendue")+'</small></span><span class="tag go">Répondre</span></button>');
    }
    if(canAct(b)&&answered(b)){
      out.push('<button class="row alert" data-a="open" data-id="'+b.id+'">'+av(b.who,40)+'<span class="rt"><b>Les réponses sont arrivées</b><small>'+esc(b.who)+', '+rng(b.from,b.to)+'. À toi de confirmer, modifier ou annuler.</small></span><span class="tag go">Voir</span></button>');
    }
  });
  B.filter(function(b){return b.status==="confirmed"&&b.who===me&&b.to<t&&nights(b.to,t)<=60}).forEach(function(b){
    var done=P.some(function(p){return p.who===me&&p.created>pd(b.to).getTime()});
    if(!done)out.push('<button class="row alert" data-a="tab" data-v="book">'+av(me,40)+'<span class="rt"><b>Raconte ton séjour</b><small>Du '+rng(b.from,b.to)+'. Quelques photos et un mot pour le livre de la maison.</small></span><span class="tag go">Ouvrir</span></button>');
  });
  return out;
}

/* ---------- accueil ---------- */
function vHome(){
  var t=today(),y=new Date().getFullYear(),h=hero(true);
  h+='<div class="wrap">';
  var td=todo();
  if(td.length)h+=sec("Pour toi",td.join(""));
  var rk=ranking(y),top3=rk.filter(function(r){return r.n>0}).slice(0,3);
  h+=sec("Les plus présents en "+y,top3.length?top3.map(function(r,i){
    return'<div class="row static"><span class="rn">'+(i+1)+'</span>'+av(r.m,40)+'<span class="rt"><b>'+esc(r.m)+'</b><small>'+plural(r.s,"séjour")+'</small></span><span class="big sm">'+r.n+'<i>nuits</i></span></div>';
  }).join(""):'<p class="empty">Aucun séjour confirmé en '+y+' pour l’instant.</p>');
  var tot=0,cnt=0;rk.forEach(function(r){tot+=r.n;cnt+=r.s});
  var days=(y%4===0&&(y%100!==0||y%400===0))?366:365;
  h+=sec("Année "+y,'<div class="fig"><div><span class="big">'+tot+'</span><small>nuits réservées</small></div><div><span class="big">'+cnt+'</span><small>séjours</small></div><div><span class="big">'+Math.round(100*tot/days)+'<i>%</i></span><small>d’occupation</small></div></div><div class="cta"></div>');
  h=h.replace('<div class="cta"></div></section>','<button class="btn cta" style="margin-top:22px" data-a="new">Demander une réservation</button></section>');
  // à la maison
  var conf=B.filter(function(b){return b.status==="confirmed"}).sort(function(a,b){return a.from<b.from?-1:1});
  var now=conf.filter(function(b){return b.from<=t&&t<b.to});
  var nx=conf.filter(function(b){return b.from>t})[0];
  var week=iso(new Date(Date.now()+7*MS));
  var soon=conf.filter(function(b){return b.from>t&&b.from<=week&&b!==nx});
  var lines="";
  now.forEach(function(b){lines+='<button class="row" data-a="open" data-id="'+b.id+'">'+av(b.who,40)+'<span class="rt"><b>'+esc(b.who)+' est à la maison</b><small>Jusqu’au '+pd(b.to).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})+'</small></span></button>'});
  if(nx){var d=nights(t,nx.from);lines+='<button class="row" data-a="open" data-id="'+nx.id+'">'+av(nx.who,40)+'<span class="rt"><b>'+(d===1?"Demain, ":"Dans "+d+" jours, ")+esc(nx.who)+' arrive</b><small>'+rng(nx.from,nx.to)+' · '+nn(nx)+'</small></span></button>'}
  soon.forEach(function(b){lines+=bRow(b)});
  h+=sec("À la maison",lines||'<p class="empty">Personne n’est prévu pour le moment.</p>');
  // demandes en cours
  var pe=B.filter(function(b){return b.status==="pending"&&b.to>=t}).sort(function(a,b){return a.from<b.from?-1:1});
  var last=B.filter(function(b){return b.status==="confirmed"}).sort(function(a,b){return(b.confirmedAt||b.created||0)-(a.confirmedAt||a.created||0)})[0];
  var en=pe.length?pe.map(bRow).join(""):'<p class="empty">Aucune demande en cours.</p>';
  if(last)en+='<p style="margin-top:14px"><small>Dernière réservation confirmée</small><b>'+esc(last.who)+'</b> a réservé la maison du '+rng(last.from,last.to)+'.</p>';
  h+=sec("Demandes en cours",en);
  // sujets
  var op=I.filter(function(x){return x.status!=="done"}).sort(function(a,b){return b.created-a.created});
  h+=sec("À régler dans la maison",op.length?op.slice(0,2).map(function(x){
    return'<button class="row" data-a="tab" data-v="issues"><span class="rt"><b>'+esc(x.title)+'</b><small>Signalé par '+esc(x.who)+' · '+fshort(x.created)+'</small></span></button>';
  }).join("")+(op.length>2?'<p style="margin-top:8px"><small>et '+(op.length-2)+' autre'+(op.length-2>1?"s":"")+'</small></p>':""):'<p class="empty">Rien à signaler. Tout est en ordre.</p>',
    '<button class="link" data-a="tab" data-v="issues">Voir tout</button>');
  // nouvelles
  var feed=[];
  B.forEach(function(b){(b.log||[]).forEach(function(l){feed.push({t:l.t,a:l.a})})});
  P.forEach(function(p){feed.push({t:p.created,a:p.who+" a ajouté un message au livre de la maison"})});
  I.forEach(function(x){feed.push({t:x.created,a:x.who+" a signalé : "+x.title});if(x.status==="done"&&x.doneAt)feed.push({t:x.doneAt,a:(x.doneBy||"Quelqu’un")+" a réglé : "+x.title})});
  feed.sort(function(a,b){return b.t-a.t});
  h+=sec("Dernières nouvelles",feed.length?feed.slice(0,6).map(function(f){return'<div class="mrow"><span>'+esc(f.a)+'</span><small>'+fshort(f.t)+'</small></div>'}).join(""):'<p class="empty">Rien pour l’instant.</p>');
  return h+'</div>';
}

/* ---------- réservation ---------- */
function vNew(){
  var f=form;if(!f.who)f.who=me;
  var h=top("Quand viens-tu ?")+'<div class="wrap"><button class="back" data-a="back">← Retour</button>';
  h+='<label for="f_who">Qui réserve</label><select id="f_who" data-f="who">'+MEMBERS.map(function(m){return'<option'+(f.who===m?" selected":"")+'>'+esc(m)+'</option>'}).join("")+'</select>';
  h+='<div class="g2"><div><label for="f_from">Arrivée</label><input type="date" id="f_from" data-f="from" value="'+esc(f.from||"")+'" min="'+today()+'"></div><div><label for="f_to">Départ</label><input type="date" id="f_to" data-f="to" value="'+esc(f.to||"")+'" min="'+esc(f.from||today())+'"></div></div>';
  h+='<div id="hint" class="hint"></div>';
  h+='<label for="f_g">Nombre de personnes (facultatif)</label><input type="number" id="f_g" data-f="g" min="1" max="30" inputmode="numeric" value="'+esc(f.g||"")+'">';
  h+='<label for="f_c">Un mot (facultatif)</label><textarea id="f_c" data-f="c" rows="3">'+esc(f.c||"")+'</textarea>';
  h+='<div id="err" class="hint bad"></div><button class="btn" data-a="submitReq"'+(busy?" disabled":"")+'>Envoyer la demande</button>';
  h+='<p style="margin-top:14px"><small>Les dates sont bloquées à ton nom en option, le temps que Marie-Laure et Solange répondent.</small></p></div>';

}
function updHint(){
  var el=$("hint");if(!el)return;
  var f=form.from,t=form.to;
  if(!f||!t){el.textContent="";el.className="hint";return}
  if(t<=f){el.textContent="Le départ doit être après l’arrivée.";el.className="hint bad";return}
  var c=B.filter(function(x){return act(x)&&overlap(x,{from:f,to:t})})[0];
  if(c){el.textContent="Déjà pris par "+c.who+" ("+rng(c.from,c.to)+").";el.className="hint bad"}
  else{el.textContent=plural(nights(f,t),"nuit")+". Les dates sont libres.";el.className="hint good"}
}
function setErr(m){var e=$("err");if(e)e.textContent=m}
function eachNight(f,t){var out=[],d=pd(f),e=pd(t);while(d<e){out.push(iso(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}return out}
function mail(names,subject,text){
  var E=CFG.emailjs;if(!E||!E.service||!E.template||!E.key)return;
  var link=location.origin+location.pathname;
  names.filter(function(n,i){return n&&n!==me&&names.indexOf(n)===i}).forEach(function(n){
    var to=DIR[n]&&DIR[n].email;if(!to)return;
    fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:E.service,template_id:E.template,user_id:E.key,template_params:{to_email:to,to_name:n,subject:subject,message:text+"\\n\\nMaison Les Terrasses : "+link}})}).catch(function(){});
  });
}
function submitReq(){
  if(busy)return;
  var f=form,who=f.who||me,from=f.from,to=f.to;
  if(!from||!to)return setErr("Choisis ta date d’arrivée et ta date de départ.");
  if(to<=from)return setErr("Le départ doit être après l’arrivée.");
  if(from<today())return setErr("La date d’arrivée est déjà passée.");
  var c=B.filter(function(x){return act(x)&&overlap(x,{from:from,to:to})})[0];
  if(c)return setErr("Ces dates sont déjà prises par "+c.who+" ("+rng(c.from,c.to)+").");
  var ref=fs.collection("bookings").doc(),now=Date.now();
  var rec={who:who,by:me,from:from,to:to,guests:f.g?+f.g:null,comment:(f.c||"").trim(),status:"pending",created:now,rML:null,rSO:null,
    log:[{t:now,a:me+" a demandé la maison"+(who!==me?" pour "+who:"")+" du "+rng(from,to)}]};
  var batch=fs.batch();
  batch.set(ref,rec);
  eachNight(from,to).forEach(function(d){batch.set(fs.collection("nights").doc(d),{bid:ref.id,who:who,by:me})});
  busy=true;render();
  batch.commit().then(function(){
    busy=false;form={};detail=ref.id;view="detail";editing=false;render();window.scrollTo(0,0);
    toast("C’est envoyé. Marie-Laure et Solange vont te répondre.");
    mail(APPR,"Nouvelle demande de réservation : "+who,who+" demande la maison du "+rng(from,to)+"."+(rec.comment?"\\n\\nMessage : "+rec.comment:"")+"\\n\\nTa réponse est attendue sur le site.");
  }).catch(function(e){
    busy=false;render();
    setErr(e&&e.code==="permission-denied"?"Ces dates viennent d’être prises par quelqu’un d’autre. Regarde le calendrier.":"Échec de l’enregistrement : "+(e&&e.message||e));
  });
}

/* ---------- fiche réservation ---------- */
function vDetail(){
  var b=byId(B,detail);
  if(!b)return top("Réservation")+'<div class="wrap"><button class="back" data-a="back">← Retour</button><p class="empty">Cette réservation est introuvable.</p></div>';
  var s=statusOf(b),h=top("Séjour")+'<div class="wrap"><button class="back" data-a="back">← Retour</button>';
  h+='<section class="sec" style="border-top:0"><div class="row static" style="border:0;padding:0">'+av(b.who,52)+'<span class="rt"><b>'+esc(b.who)+'</b><small>Demande du '+fshort(b.created||0)+(b.by&&b.by!==b.who?" par "+esc(b.by):"")+'</small></span><span class="tag '+s.cls+'">'+s.label+'</span></div>';
  h+='<div class="date-title">'+rng(b.from,b.to)+'</div><small>'+nn(b)+'</small>';
  if(b.comment)h+='<p class="quote">« '+esc(b.comment)+' »</p>';
  h+='</section>';
  // réponses
  var rows=APPR.map(function(n){
    var r=resp(b,n),tg,txt="";
    if(!r)tg='<span class="tag">Pas encore répondu</span>';
    else{tg=r.v==="yes"?'<span class="tag ok">Oui</span>':r.v==="no"?'<span class="tag no">Non</span>':'<span class="tag opt">En attente</span>';if(r.c)txt='<p class="quote" style="font-size:16px">« '+esc(r.c)+' »</p>'}
    return'<div class="mrow"><div class="head"><span style="display:flex;gap:10px;align-items:center">'+av(n,32)+'<b>'+esc(n)+'</b></span>'+tg+'</div>'+txt+'</div>';
  }).join("");
  h+=sec("Réponses",rows);
  // répondre
  if(b.status==="pending"&&APPR.indexOf(me)>=0){
    var mine=resp(b,me),cur=form.av||(mine&&mine.v)||"";
    h+=sec("Ta réponse",'<div class="opts">'+[["yes","Accepter"],["wait","En attente"],["no","Refuser"]].map(function(o){return'<button class="'+(cur===o[0]?"on":"")+'" data-a="pick" data-v="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div><label for="f_ac">Un mot (facultatif)</label><textarea id="f_ac" data-f="ac" rows="2">'+esc(form.ac||"")+'</textarea><div style="height:12px"></div><button class="btn" data-a="answer"'+(cur?"":" disabled")+'>Envoyer ma réponse</button>');
  }
  // demandeur
  if(canAct(b)&&act(b)){
    var a="";
    if(editing){
      a='<div class="g2"><div><label for="e_from">Arrivée</label><input type="date" id="e_from" data-f="ef" value="'+esc(form.ef||b.from)+'" min="'+today()+'"></div><div><label for="e_to">Départ</label><input type="date" id="e_to" data-f="et" value="'+esc(form.et||b.to)+'"></div></div><div id="err" class="hint bad"></div><div class="btns"><button class="btn sm" data-a="saveEdit">Enregistrer</button><button class="btn sm ghost" data-a="cancelEdit">Fermer</button></div><p style="margin-top:10px"><small>Après une modification, Marie-Laure et Solange doivent répondre à nouveau.</small></p>';
    }else{
      if(b.status==="pending"){
        a+='<button class="btn" data-a="confirm"'+(answered(b)?"":" disabled")+'>Confirmer mon séjour</button>';
        if(!answered(b))a+='<p style="margin-top:8px"><small>Disponible dès que Marie-Laure et Solange ont répondu.</small></p>';
        else a+='<p style="margin-top:8px"><small>Tu peux confirmer même si l’une des réponses est non ou en attente, par exemple après un appel.</small></p>';
      }
      a+='<div class="btns" style="margin-top:12px"><button class="btn sm ghost" data-a="edit">Modifier les dates</button>'+(form.cx===b.id?'<button class="btn sm danger" data-a="cancelB">Oui, annuler</button><button class="btn sm ghost" data-a="noCancel">Non, garder</button>':'<button class="btn sm danger" data-a="cancelB">Annuler</button>')+'</div>';
    }
    h+=sec(b.status==="confirmed"?"Ton séjour":"Ton choix",a);
  }
  // journal
  h+=sec("Suivi",(b.log||[]).slice().reverse().map(function(l){return'<div class="mrow"><span>'+esc(l.a)+'</span><small>'+fshort(l.t)+'</small></div>'}).join("")||'<p class="empty">Rien.</p>');
  return h+'</div>';
}
function upd(b,fields,text){
  fields.log=(b.log||[]).concat([{t:Date.now(),a:text}]);
  return fs.collection("bookings").doc(b.id).update(fields).then(function(){return true},function(e){toast("Échec : "+(e&&e.message||e));return false});
}

/* ---------- calendrier ---------- */
function vCal(){
  var y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),t=today();
  var h=top("Calendrier")+'<div class="wrap"><div class="mnav"><button data-a="mv" data-v="-1" aria-label="Mois précédent">‹</button><h2>'+first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})+'</h2><button data-a="mv" data-v="1" aria-label="Mois suivant">›</button></div><div class="cal">';
  ["L","M","M","J","V","S","D"].forEach(function(x){h+='<div class="dh">'+x+'</div>'});
  for(var i=0;i<off;i++)h+='<div class="dc blank"></div>';
  for(var d=1;d<=dim;d++){
    var s=iso(new Date(y,m,d)),b=B.filter(function(x){return act(x)&&x.from<=s&&s<x.to})[0];

/* ---------- images ---------- */
function resize(file,max,q,square){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,sx=0,sy=0,sw=w,sh=h;
      if(square){var s=Math.min(w,h);sx=(w-s)/2;sy=(h-s)/2;sw=sh=s;w=h=s}
      var k=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
      c.width=Math.round(w*k);c.height=Math.round(h*k);
      c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function(b){b?res(b):rej(new Error("image"))},"image/jpeg",q);
    };
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error("image illisible"))};
    img.src=u;
  });
}
function dataUrl(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(blob)})}
function saveAvatar(file){
  resize(file,160,.82,true).then(dataUrl).then(function(u){
    return fs.collection("profiles").doc(me).set({photo:u});
  }).then(function(){toast("Photo enregistrée.");if(onb==="photo"){onb=null;view="home"}render()})
  .catch(function(e){toast("Photo non enregistrée : "+(e&&e.message||e))});
}

  filt:function(t){filt=t.dataset.v;render()},
  pick:function(t){form.av=t.dataset.v;render()},
  answer:function(){
    var b=byId(B,detail),v=form.av||(b&&resp(b,me)&&resp(b,me).v);if(!b||!v)return;
    var c=(form.ac||"").trim(),f={},mine={v:v,c:c,t:Date.now()};
    f[FIELD[me]]=mine;
    upd(b,f,me+" "+({yes:"a accepté",wait:"a mis en attente",no:"a refusé"})[v]+" la demande de "+b.who).then(function(ok){
      if(!ok)return;
      form.av=null;toast("Réponse envoyée.");render();
      var other=APPR.filter(function(n){return n!==me})[0],ro=other&&resp(b,other);
      if(ro){
        var lab={yes:"Oui",wait:"En attente",no:"Non"};
        var txt=APPR.map(function(n){var r=n===me?mine:ro;return n+" : "+lab[r.v]+(r.c?" ("+r.c+")":"")}).join("\\n");
        mail([b.who,b.by],"Les réponses sont arrivées pour ta demande","Pour ta demande du "+rng(b.from,b.to)+" :\\n\\n"+txt+"\\n\\nTu peux confirmer, modifier ou annuler ton séjour sur le site.");
      }
    });
  },
  confirm:function(){
    var b=byId(B,detail);if(!b||!answered(b))return;
    upd(b,{status:"confirmed",confirmedAt:Date.now()},b.who+" a confirmé son séjour du "+rng(b.from,b.to)).then(function(ok){
      if(!ok)return;toast("Séjour confirmé. À très vite à la maison !");
      mail(APPR,"Séjour confirmé : "+b.who,b.who+" a confirmé son séjour du "+rng(b.from,b.to)+".");
    });
  },
  edit:function(){var b=byId(B,detail);form.ef=b.from;form.et=b.to;editing=true;render()},
  cancelEdit:function(){editing=false;render()},
  saveEdit:function(){
    var b=byId(B,detail),f=form.ef,t=form.et;
    if(!f||!t||t<=f)return setErr("Le départ doit être après l’arrivée.");
    var c=B.filter(function(x){return x.id!==b.id&&act(x)&&overlap(x,{from:f,to:t})})[0];
    if(c)return setErr("Ces dates sont déjà prises par "+c.who+" ("+rng(c.from,c.to)+").");
    var oldN=eachNight(b.from,b.to),newN=eachNight(f,t),batch=fs.batch();
    var txt=me+" a modifié les dates : "+rng(f,t)+". Les réponses sont à renouveler";
    batch.update(fs.collection("bookings").doc(b.id),{from:f,to:t,status:"pending",rML:null,rSO:null,confirmedAt:null,log:(b.log||[]).concat([{t:Date.now(),a:txt}])});
    oldN.filter(function(x){return newN.indexOf(x)<0}).forEach(function(d){batch.delete(fs.collection("nights").doc(d))});
    newN.filter(function(x){return oldN.indexOf(x)<0}).forEach(function(d){batch.set(fs.collection("nights").doc(d),{bid:b.id,who:b.who,by:me})});
    batch.commit().then(function(){
      editing=false;toast("Dates modifiées. Les réponses sont à renouveler.");render();
      mail(APPR,"Dates modifiées : "+b.who,b.who+" a modifié sa demande : "+rng(f,t)+". Une nouvelle réponse est attendue.");
    }).catch(function(e){setErr(e&&e.code==="permission-denied"?"Ces dates viennent d’être prises par quelqu’un d’autre.":"Échec : "+(e&&e.message||e))});
  },
  cancelB:function(){
    var b=byId(B,detail);
    if(form.cx!==b.id){form.cx=b.id;render();return}
    form.cx=null;
    var batch=fs.batch();
    batch.update(fs.collection("bookings").doc(b.id),{status:"cancelled",log:(b.log||[]).concat([{t:Date.now(),a:me+" a annulé la réservation de "+b.who+" du "+rng(b.from,b.to)}])});
    eachNight(b.from,b.to).forEach(function(d){batch.delete(fs.collection("nights").doc(d))});
    batch.commit().then(function(){
      toast("Réservation annulée.");
      mail(APPR,"Réservation annulée : "+b.who,me+" a annulé la réservation de "+b.who+" du "+rng(b.from,b.to)+".");
    }).catch(function(e){toast("Échec : "+(e&&e.message||e))});
  },
  noCancel:function(){form.cx=null;render()},
  setMode:function(t){mode=t.dataset.v;render()},
  doLogin:function(){
    var em=(form.lmail||"").trim().toLowerCase(),pw=form.lpw||"";
    if(!em||!pw)return setErr("Entre ton adresse e-mail et ton mot de passe.");
    busy=true;render();
    var p=mode==="up"?auth.createUserWithEmailAndPassword(em,pw).then(function(c){return c.user.sendEmailVerification()}):auth.signInWithEmailAndPassword(em,pw);
    p.then(function(){busy=false;form.lpw="";render()}).catch(function(e){busy=false;render();setErr(authMsg(e))});
  },
  doReset:function(){
    var em=(form.lmail||"").trim().toLowerCase();
    if(!em)return setErr("Entre d’abord ton adresse e-mail.");
    auth.sendPasswordResetEmail(em).then(function(){toast("Un e-mail pour changer ton mot de passe vient d’être envoyé.")}).catch(function(e){setErr(authMsg(e))});
  },
  claim:function(){
    var n=form.cn,code=(form.ccode||"").trim().toLowerCase();
    if(!n)return setErr("Choisis ton prénom.");
    if(!code)return setErr("Entre le code de la famille.");
    var em=user.email.toLowerCase(),batch=fs.batch();
    batch.set(fs.collection("byEmail").doc(em),{name:n,code:code});
    batch.set(fs.collection("taken").doc(n),{t:Date.now()});
    busy=true;render();
    batch.commit().then(function(){busy=false;form={};afterUser(user)}).catch(function(){busy=false;render();setErr("Ce prénom est déjà pris, ou le code de la famille est incorrect.")});
  },
  resend:function(){user.sendEmailVerification().then(function(){toast("E-mail renvoyé.")}).catch(function(e){toast(authMsg(e))})},
  checkVerif:function(){
    user.reload().then(function(){
      var u=auth.currentUser;
      if(!u.emailVerified){toast("Pas encore vérifié. Regarde aussi dans les courriers indésirables.");return}
      return u.getIdToken(true).then(function(){afterUser(u)});
    }).catch(function(e){toast(authMsg(e))});
  },
  signout:function(){auth.signOut()},
  logout:function(){auth.signOut()},
  skipPhoto:function(){lsSet("mlt_skip_"+me,"1");onb=null;view="home";render()},
  rmPhoto:function(){fs.collection("profiles").doc(me).set({photo:null}).then(function(){toast("Photo retirée.")})},
  postSubmit:postSubmit,
  postDel:function(t){
    if(form.dp!==t.dataset.id){form.dp=t.dataset.id;render();return}
    form.dp=null;fs.collection("posts").doc(t.dataset.id).delete().then(function(){toast("Message supprimé.")}).catch(function(e){toast("Échec : "+(e&&e.message||e))});
  },
  issueSubmit:function(){
    var ti=(form.it||"").trim();if(!ti)return toast("Donne un titre au sujet.");
    busy=true;render();
    var up=files.issue.length?dataUrl(files.issue[0].blob):Promise.resolve(null);
    up.then(function(pu){return fs.collection("issues").add({title:ti,detail:(form.id||"").trim(),who:me,created:Date.now(),photo:pu,status:"open",comments:[]})}).then(function(){
      files.issue=[];form.it="";form.id="";busy=false;render();toast("Sujet ajouté.");
    }).catch(function(e){busy=false;render();toast("Échec : "+(e&&e.message||e))});
  },
  idone:function(t){fs.collection("issues").doc(t.dataset.id).update({status:"done",doneBy:me,doneAt:Date.now()}).then(function(){toast("Marqué comme réglé.")}).catch(function(e){toast("Échec : "+(e&&e.message||e))})},
  ireopen:function(t){fs.collection("issues").doc(t.dataset.id).update({status:"open",doneBy:null,doneAt:null}).catch(function(e){toast("Échec : "+(e&&e.message||e))})},
  icom:function(t){
    var id=t.dataset.id,x=byId(I,id),txt=(form["c_"+id]||"").trim();if(!x||!txt)return;
    fs.collection("issues").doc(id).update({comments:(x.comments||[]).concat([{who:me,t:Date.now(),text:txt}])}).then(function(){form["c_"+id]="";render()}).catch(function(e){toast("Échec : "+(e&&e.message||e))});
  },
  toggleDone:function(){showDone=!showDone;render()},
  zoom:function(t){var lb=$("lb");lb.innerHTML='<img src="'+t.src+'" alt="">';lb.hidden=false}
};
document.addEventListener("click",function(e){
  if(e.target.closest("#lb")){$("lb").hidden=true;return}
  var t=e.target.closest("[data-a]");
  if(!t||t.disabled)return;
  var f=H[t.dataset.a];if(f)f(t,e);
});
function onField(e){
  var t=e.target,k=t.dataset&&t.dataset.f;
  if(!k)return;
  form[k]=t.value;
  if(k==="from"||k==="to"){
    if(k==="from"){var tt=$("f_to");if(tt)tt.min=t.value||today()}
    updHint();
  }
}
document.addEventListener("input",onField);
document.addEventListener("change",function(e){
  onField(e);
  var t=e.target,k=t.dataset&&t.dataset.file;
  if(!k||!t.files||!t.files.length)return;
  var list=Array.prototype.slice.call(t.files);t.value="";
  if(k==="avatar"){saveAvatar(list[0]);return}
  var max=k==="post"?3-files.post.length:1;
  if(k==="issue")files.issue=[];
  list.slice(0,Math.max(max,k==="issue"?1:0)).reduce(function(p,f){
    return p.then(function(){return resize(f,1000,.7,false)}).then(function(b){files[k].push({blob:b,url:URL.createObjectURL(b)})});
  },Promise.resolve()).then(function(){render()}).catch(function(err){toast("Photo illisible : "+(err&&err.message||err))});
});
document.addEventListener("focusout",function(){if(pend)setTimeout(function(){if(pend)soft()},800)});

/* ---------- démarrage ---------- */
function unsubAll(){unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[]}
function subscribe(){
  unsubAll();ready=false;profLoaded=false;
  function bad(e){
    if(!ready)$("app").innerHTML='<div class="wrap"><section class="sec" style="padding-top:48px"><h2 class="pt" style="font-size:32px">Accès refusé par la base</h2><p style="margin-top:10px;color:var(--mut)">Les règles de sécurité ne sont pas encore publiées, ou ton adresse n’y figure pas ('+esc(e&&e.code||"erreur")+').</p></section></div>';
  }
  function rows(s,fn){return s.docs.map(function(x){var o=x.data();o.id=x.id;return fn?fn(o):o})}
  unsubs.push(fs.collection("bookings").onSnapshot(function(s){B=rows(s,norm);ready=true;soft()},bad));
  unsubs.push(fs.collection("posts").orderBy("created","desc").limit(40).onSnapshot(function(s){P=rows(s);soft()},function(){}));
  unsubs.push(fs.collection("issues").orderBy("created","desc").limit(150).onSnapshot(function(s){I=rows(s);soft()},function(){}));
  unsubs.push(fs.collection("profiles").onSnapshot(function(s){
    var m={};s.docs.forEach(function(x){m[x.id]={photo:x.data().photo||null}});MB=m;
    if(!profLoaded){profLoaded=true;if(!(MB[me]&&MB[me].photo)&&!lsGet("mlt_skip_"+me))onb="photo"}
    soft();
  },function(){}));
  unsubs.push(fs.collection("directory").onSnapshot(function(s){var d={};s.docs.forEach(function(x){d[x.id]=x.data()});DIR=d},function(){}));
}
function afterUser(u){
  user=u;authReady=true;
  if(!u){unsubAll();me=null;ready=false;onb=null;B=[];P=[];I=[];MB={};TAKEN={};render();return}
  if(!u.emailVerified){render();return}
  var em=u.email.toLowerCase();
  fs.collection("byEmail").doc(em).get().then(function(s){
    if(s.exists){
      me=s.data().name;view="home";subscribe();render();
      fs.collection("directory").doc(me).set({email:em}).catch(function(){});
      return;
    }
    me=null;
    return fs.collection("taken").get().then(function(q){var x={};q.docs.forEach(function(d){x[d.id]=1});TAKEN=x;render()});
  }).catch(function(e){
    $("app").innerHTML=vMsg("Accès refusé par la base","Les règles de sécurité ne sont pas encore publiées ("+esc(e&&e.code||"erreur")+").");
  });
}
function boot(){
  if(!CFG.firebase||!CFG.firebase.apiKey||!window.firebase){authReady=true;render();return}
  firebase.initializeApp(CFG.firebase);
  auth=firebase.auth();fs=firebase.firestore();
  auth.onAuthStateChanged(function(u){afterUser(u)});
}
boot();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body></html>
